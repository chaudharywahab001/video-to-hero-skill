<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-scrub hero</title>
<style>
  :root{ --text: {{TEXT_COLOR}}; --accent: {{ACCENT}}; }
  *{box-sizing:border-box} body{margin:0;background:#0b0b0c;color:var(--text);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .scrub{height:{{SCROLL_VH}}vh;position:relative}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
  canvas{width:100%;height:100%;object-fit:cover;display:block}
  .copy{position:absolute;inset:auto 0 12vh 0;padding:0 6vw;max-width:44rem}
  h1{font-size:clamp(2rem,6vw,4.5rem);line-height:1.02;margin:0 0 .6rem;letter-spacing:-.02em}
  p{margin:0;opacity:.82;max-width:32rem}
  .after{min-height:60vh;display:grid;place-items:center;padding:6vw;text-align:center}
  @media (prefers-reduced-motion: reduce){ .scrub{height:100vh} }
</style></head><body>
<section class="scrub" id="scrub">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="copy">
      <h1>{{HEADLINE}}</h1>
      <p>{{SUBHEAD}}</p>
    </div>
  </div>
</section>
<section class="after"><p>Scroll-scrub hero, {{FRAME_COUNT}} frames, {{FRAME_KB}} KB total.</p></section>
<script>
const COUNT={{FRAME_COUNT}}, PATTERN="{{FRAME_PATTERN}}";
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d",{alpha:false});
const frames=new Array(COUNT); let current=-1, target=0;
const dpr=Math.min(window.devicePixelRatio||1, 2);
function fit(){ const r=canvas.getBoundingClientRect();
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); }
function url(i){ return PATTERN.replace("####", String(i+1).padStart(4,"0")); }
function draw(i){
  const img=frames[i]; if(!img || !img.complete || !img.naturalWidth) return;
  const s=Math.max(canvas.width/img.naturalWidth, canvas.height/img.naturalHeight);
  const w=img.naturalWidth*s, h=img.naturalHeight*s;
  ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
  current=i;
}
// two-pass load: every 8th frame first so the scrub is usable almost immediately, then fill gaps
function load(i){ if(frames[i]) return; const im=new Image(); im.decoding="async";
  im.src=url(i); im.onload=()=>{ if(i===0) draw(0); }; frames[i]=im; }
function preload(){ for(let i=0;i<COUNT;i+=8) load(i);
  const fill=()=>{ for(let i=0;i<COUNT;i++) if(!frames[i]) { load(i); if(i%16===0) return setTimeout(fill,60); } };
  setTimeout(fill,400); }
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function onScroll(){
  const sec=document.getElementById("scrub"), r=sec.getBoundingClientRect();
  const total=r.height-window.innerHeight;
  const p=Math.min(1,Math.max(0,-r.top/(total||1)));
  target=Math.round(p*(COUNT-1));
}
function loop(){ if(target!==current) draw(target); requestAnimationFrame(loop); }
addEventListener("resize",()=>{fit(); draw(current<0?0:current);});
addEventListener("scroll",onScroll,{passive:true});
fit(); preload(); onScroll();
if(!reduce){ draw(0); requestAnimationFrame(loop); } else { load(0); }
</script></body></html>
